[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bone-age-training"
version = "0.1.0"
description = "Training companion for ianpan/bone-age"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
authors = [{name = "Ian Pan"}]
dependencies = [
  "torch==2.6.0", "torchvision==0.21.0", "timm==1.0.12",
  "albumentations==1.4.24", "lightning==2.5.0.post0", "torchmetrics==1.6.1",
  "numpy>=1.26,<2", "pandas>=2.2,<3", "scikit-image>=0.24,<0.26",
  "opencv-python-headless>=4.9,<4.12", "transformers==4.47.1",
  "safetensors>=0.4.5,<1", "huggingface-hub>=0.26,<1",
]

[project.optional-dependencies]
cpu = ["torch==2.6.0", "torchvision==0.21.0"]
cu124 = ["torch==2.6.0", "torchvision==0.21.0"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
bone-age = "bone_age_training.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bone_age_training"]

[tool.uv]
conflicts = [[{extra = "cpu"}, {extra = "cu124"}]]

[tool.uv.sources]
torch = [{index = "pytorch-cpu", extra = "cpu"}, {index = "pytorch-cu124", extra = "cu124"}]
torchvision = [{index = "pytorch-cpu", extra = "cpu"}, {index = "pytorch-cu124", extra = "cu124"}]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
